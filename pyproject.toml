[project]
name = "jev-cache"
version = "0.1.0"
description = "A Windows memory assistant with local memory and bounded Jev decisions"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "psutil>=6.1,<8",
  "pywin32>=308; sys_platform == 'win32'",
  "typesafe-sdk>=0.7.2,<0.8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6.12,<7"]

[project.gui-scripts]
jev-cache = "jev_cache.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
